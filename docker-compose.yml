services:
  edu-node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${NODE_PORT:-8224}:8000"
    environment:
      EDU_CHAIN_DIR: /data/chain
    volumes:
      - edu_chain:/data/chain
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  edu_chain:
