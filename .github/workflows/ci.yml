name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uvx ruff check .

  sast:
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql
      - name: Semgrep
        run: |
          uvx semgrep scan --config auto --config p/owasp-top-ten --config p/python --severity ERROR --error --sarif --output semgrep.sarif || echo "SEMGREP_FAILED=1" >> "$GITHUB_ENV"
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Fail on Semgrep findings
        run: test -z "${SEMGREP_FAILED:-}"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit
        # `uvx pip-audit` would audit pip-audit's own isolated tool environment, not this
        # project's dependencies. The project declares none today, so both forms currently
        # report the same thing -- this form keeps the audit correct once dependencies land.
        run: uv run --with pip-audit pip-audit
