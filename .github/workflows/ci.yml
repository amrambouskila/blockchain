name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uvx ruff check .

  sast:
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql
      - name: Semgrep
        run: |
          uvx semgrep scan --config auto --config p/owasp-top-ten --config p/python --severity ERROR --error --sarif --output semgrep.sarif || echo "SEMGREP_FAILED=1" >> "$GITHUB_ENV"
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Fail on Semgrep findings
        run: test -z "${SEMGREP_FAILED:-}"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Dependency audit
        # `uvx pip-audit` would audit pip-audit's own isolated tool environment, not this
        # project's dependencies. `uv run --with pip-audit` audits the project lockfile.
        run: uv run --with pip-audit pip-audit

  test:
    runs-on: ubuntu-latest
    needs: [sast]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: uv run pytest
      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: wallet tests
          path: .runtime/junit-unit.xml
          reporter: java-junit

  docker-build:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t blockchain-edu-node:ci .
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blockchain-edu-node:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          vuln-type: os,library
